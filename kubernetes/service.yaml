apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  labels:
    app: heart-disease-api
spec:
  # A cloud or local-cluster load-balancer implementation is required for an
  # external address; port-forward remains available for local inspection.
  type: LoadBalancer
  selector:
    app: heart-disease-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
