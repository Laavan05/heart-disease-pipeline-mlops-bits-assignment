name: Heart Disease MLOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-train:
    name: Lint, test, and train
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Check out the revision that triggered this workflow.
      - name: Check out repository
        uses: actions/checkout@v4

      # Use the project's supported Python version and cache pip downloads.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Install the same dependencies used by local development and CI.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Fail the job if project Python sources do not pass Flake8.
      - name: Run Flake8
        run: python -m flake8 src app tests

      # Run the complete automated test suite in verbose mode.
      - name: Run pytest
        run: python -m pytest -v

      # Ensure the essential preprocessing, training, and API modules exist.
      - name: Verify critical source files
        run: |
          test -f src/preprocess.py
          test -f src/train.py
          test -f app/main.py

      # Train the models and generate the preprocessor and model artifacts.
      - name: Train models
        run: python src/train.py

      # Stop before artifact upload if training did not create expected files.
      - name: Verify generated model artifacts
        run: |
          test -s models/best_model.pkl
          test -s models/preprocessor.pkl

      # Preserve trained models, metrics, and generated screenshots.
      - name: Upload model and screenshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-model-artifacts
          path: |
            models/
            screenshots/
          if-no-files-found: error
          retention-days: 14
